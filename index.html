<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceLinks Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-box {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }
        .login-box h1 {
            color: #6366f1;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .login-box p {
            color: #64748b;
            margin-bottom: 30px;
        }
        .google-btn {
            background: #4285f4;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
        }
        .google-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(66, 133, 244, 0.4);
        }
        .app-container { display: none; min-height: 100vh; }
        .header {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            box-shadow: 0 2px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { display: flex; align-items: center; gap: 15px; }
        .logo-icon {
            width: 45px; height: 45px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 24px;
        }
        .logo h1 {
            font-size: 24px;
            background: linear-gradient(135deg, #6366f1, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-avatar {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: 3px solid #6366f1;
            object-fit: cover;
            background: #e2e8f0;
        }
        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .logout-btn:hover { background: #dc2626; }
        .main-content {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            padding: 30px 40px;
            max-width: 1600px;
            margin: 0 auto;
        }
        .sidebar {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            height: fit-content;
        }
        .sidebar h2 {
            color: #6366f1;
            margin-bottom: 20px;
            font-size: 18px;
        }
        .folder-list { list-style: none; margin-bottom: 30px; }
        .folder-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
            transition: all 0.3s;
            position: relative;
        }
        .folder-item:hover, .folder-item.active {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
        }
        .folder-name {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .folder-actions {
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: all 0.3s;
        }
        .folder-item:hover .folder-actions {
            opacity: 1;
        }
        .folder-action-btn {
            background: white;
            border: none;
            cursor: pointer;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.3s;
            font-weight: 600;
        }
        .folder-action-btn.edit-btn {
            color: #f59e0b;
        }
        .folder-action-btn.edit-btn:hover {
            background: #f59e0b;
            color: white;
        }
        .folder-action-btn.delete-btn {
            color: #ef4444;
        }
        .folder-action-btn.delete-btn:hover {
            background: #ef4444;
            color: white;
        }
        .add-folder-btn {
            width: 100%;
            padding: 12px;
            background: #10b981;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }
        .add-folder-btn:hover { background: #059669; }
        .content {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }
        .toolbar {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .search-box { flex: 1; min-width: 250px; position: relative; }
        .search-box input {
            width: 100%;
            padding: 12px 45px 12px 15px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
        }
        .search-box input:focus { outline: none; border-color: #6366f1; }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
            font-size: 14px;
        }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-secondary { background: #f8fafc; color: #1e293b; border: 2px solid #e2e8f0; }
        .btn-success { background: #10b981; color: white; }
        .btn-success:hover { background: #059669; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .stat-value { font-size: 32px; font-weight: 700; margin-bottom: 5px; }
        .stat-label { font-size: 14px; opacity: 0.9; }
        .links-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }
        .link-card {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #e2e8f0;
            transition: all 0.3s;
        }
        .link-card:hover {
            border-color: #6366f1;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .link-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }
        .link-title { font-size: 18px; font-weight: 700; color: #1e293b; margin-bottom: 5px; }
        .link-folder {
            display: inline-block;
            padding: 4px 12px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .link-actions { display: flex; gap: 8px; }
        .icon-btn {
            width: 32px; height: 32px;
            border: none; border-radius: 8px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
        }
        .icon-btn.edit { background: #f59e0b; color: white; }
        .icon-btn.delete { background: #ef4444; color: white; }
        .link-url {
            background: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            color: #64748b;
            word-break: break-all;
            margin-bottom: 12px;
            border: 1px solid #e2e8f0;
        }
        .link-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        .tag {
            padding: 4px 10px;
            background: white;
            border: 1px solid #6366f1;
            color: #6366f1;
            border-radius: 15px;
            font-size: 12px;
        }
        .link-date { font-size: 12px; color: #64748b; }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }
        .modal-header h2 { color: #6366f1; }
        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #64748b;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1e293b;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 14px;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: #6366f1;
        }
        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 25px;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
            grid-column: 1/-1;
        }
        .empty-state-icon { font-size: 80px; margin-bottom: 20px; opacity: 0.5; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <h1>🎵 VoiceLinks Manager</h1>
            <p>Quản lý và tổ chức các đường link âm thanh của bạn</p>
            <button class="google-btn" id="googleLoginBtn">
                🔐 Đăng nhập bằng Google
            </button>
        </div>
    </div>

    <!-- Main App -->
    <div id="appContainer" class="app-container">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">🎵</div>
                <h1>VoiceLinks Manager</h1>
            </div>
            <div class="user-info">
                <img id="userAvatar" class="user-avatar" src="" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?name=User&background=6366f1&color=fff'">
                <span id="userName"></span>
                <button class="logout-btn" id="logoutBtn">Đăng xuất</button>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <h2>📁 Thư mục</h2>
                <ul id="folderList" class="folder-list"></ul>
                <button class="add-folder-btn" id="addFolderBtn">+ Thêm thư mục</button>
            </aside>

            <main class="content">
                <div class="stats">
                    <div class="stat-card">
                        <div class="stat-value" id="totalLinks">0</div>
                        <div class="stat-label">Tổng số links</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalFolders">0</div>
                        <div class="stat-label">Thư mục</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="totalTags">0</div>
                        <div class="stat-label">Tags</div>
                    </div>
                </div>

                <div class="toolbar">
                    <div class="search-box">
                        <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm theo tên, URL hoặc tag...">
                    </div>
                    <button class="btn btn-primary" id="addLinkBtn">+ Thêm link</button>
                    <button class="btn btn-success" id="exportBtn">💾 Xuất JSON</button>
                    <button class="btn btn-secondary" id="importBtn"> Nhập JSON</button>
                    <input type="file" id="importFile" accept=".json" style="display:none">
                </div>

                <div id="linksContainer" class="links-grid"></div>
            </main>
        </div>
    </div>

    <!-- Link Modal -->
    <div id="linkModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="linkModalTitle">Thêm link mới</h2>
                <button class="close-btn" id="closeLinkModal">&times;</button>
            </div>
            <form id="linkForm">
                <input type="hidden" id="linkId">
                <div class="form-group">
                    <label>Tên link *</label>
                    <input type="text" id="linkName" required placeholder="Ví dụ: Bài hát yêu thích">
                </div>
                <div class="form-group">
                    <label>URL *</label>
                    <input type="url" id="linkUrl" required placeholder="https://voca.ro/...">
                </div>
                <div class="form-group">
                    <label>Thư mục *</label>
                    <select id="linkFolder" required></select>
                </div>
                <div class="form-group">
                    <label>Tags (phân cách bằng dấu phẩy)</label>
                    <input type="text" id="linkTags" placeholder="nhạc, vui, podcast">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelLinkBtn">Hủy</button>
                    <button type="submit" class="btn btn-primary">Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Folder Modal -->
    <div id="folderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="folderModalTitle">Thêm thư mục mới</h2>
                <button class="close-btn" id="closeFolderModal">&times;</button>
            </div>
            <form id="folderForm">
                <input type="hidden" id="folderId">
                <div class="form-group">
                    <label>Tên thư mục *</label>
                    <input type="text" id="folderName" required placeholder="Ví dụ: Nhạc yêu thích">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" id="cancelFolderBtn">Hủy</button>
                    <button type="submit" class="btn btn-primary" id="folderSubmitBtn">Tạo</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            signInWithPopup, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            doc, 
            setDoc, 
            getDocs, 
            deleteDoc 
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBVBGxTsyvKR0ha0s4_Syk-b7ZXt-rOBps",
            authDomain: "voicelinks.firebaseapp.com",
            projectId: "voicelinks",
            storageBucket: "voicelinks.firebasestorage.app",
            messagingSenderId: "389020652364",
            appId: "1:389020652364:web:c59ace420a0f780d5bf5e9",
            measurementId: "G-S4YTEEH66H"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        let currentFolder = 'all';
        let links = [];
        let folders = [];

        // DOM Elements
        const loginScreen = document.getElementById('loginScreen');
        const appContainer = document.getElementById('appContainer');
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const userAvatar = document.getElementById('userAvatar');
        const userName = document.getElementById('userName');
        const folderList = document.getElementById('folderList');
        const linksContainer = document.getElementById('linksContainer');
        const searchInput = document.getElementById('searchInput');
        const addLinkBtn = document.getElementById('addLinkBtn');
        const addFolderBtn = document.getElementById('addFolderBtn');
        const exportBtn = document.getElementById('exportBtn');
        const importBtn = document.getElementById('importBtn');
        const importFile = document.getElementById('importFile');
        const linkModal = document.getElementById('linkModal');
        const folderModal = document.getElementById('folderModal');
        const linkForm = document.getElementById('linkForm');
        const folderForm = document.getElementById('folderForm');
        const folderModalTitle = document.getElementById('folderModalTitle');
        const folderSubmitBtn = document.getElementById('folderSubmitBtn');

        // Hàm tạo avatar fallback
        function getAvatarUrl(user) {
            if (user.photoURL) {
                return user.photoURL;
            }
            // Tạo avatar từ tên người dùng
            const name = user.displayName || user.email || 'User';
            return `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=6366f1&color=fff&size=128`;
        }

        // Auth State
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginScreen.style.display = 'none';
                appContainer.style.display = 'block';
                userAvatar.src = getAvatarUrl(user);
                userAvatar.onerror = function() {
                    this.src = 'https://ui-avatars.com/api/?name=User&background=6366f1&color=fff';
                };
                userName.textContent = user.displayName || user.email;
                loadData();
            } else {
                currentUser = null;
                loginScreen.style.display = 'flex';
                appContainer.style.display = 'none';
            }
        });

        // Google Login
        googleLoginBtn.addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (error) {
                alert('Lỗi đăng nhập: ' + error.message);
                console.error(error);
            }
        });

        // Logout
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                alert('Lỗi đăng xuất: ' + error.message);
            }
        });

        // Load Data
        async function loadData() {
            if (!currentUser) return;

            try {
                const foldersRef = collection(db, 'users', currentUser.uid, 'folders');
                const foldersSnap = await getDocs(foldersRef);
                folders = foldersSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                if (folders.length === 0) {
                    await setDoc(doc(db, 'users', currentUser.uid, 'folders', 'default'), {
                        name: 'Chưa phân loại',
                        createdAt: new Date().toISOString()
                    });
                    folders = [{ id: 'default', name: 'Chưa phân loại' }];
                }

                const linksRef = collection(db, 'users', currentUser.uid, 'links');
                const linksSnap = await getDocs(linksRef);
                links = linksSnap.docs.map(d => ({ id: d.id, ...d.data() }));

                renderFolders();
                renderLinks();
                updateStats();
            } catch (error) {
                console.error('Lỗi tải dữ liệu:', error);
                alert('Lỗi tải dữ liệu: ' + error.message);
            }
        }

        function renderFolders() {
            folderList.innerHTML = `
                <li class="folder-item ${currentFolder === 'all' ? 'active' : ''}" data-folder="all">
                    <span class="folder-name"> Tất cả</span>
                </li>
            `;

            folders.forEach(folder => {
                const linkCount = links.filter(l => l.folder === folder.id).length;
                folderList.innerHTML += `
                    <li class="folder-item ${currentFolder === folder.id ? 'active' : ''}" data-folder="${folder.id}">
                        <span class="folder-name">📁 ${folder.name} (${linkCount})</span>
                        <div class="folder-actions">
                            <button class="folder-action-btn edit-btn" data-folder-id="${folder.id}" title="Sửa tên">✏️ Sửa</button>
                            <button class="folder-action-btn delete-btn" data-folder-id="${folder.id}" title="Xóa thư mục">️ Xóa</button>
                        </div>
                    </li>
                `;
            });

            const linkFolderSelect = document.getElementById('linkFolder');
            linkFolderSelect.innerHTML = folders.map(f => 
                `<option value="${f.id}">${f.name}</option>`
            ).join('');

            // Folder click handler
            folderList.querySelectorAll('.folder-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    if (e.target.closest('.folder-actions')) return;
                    currentFolder = item.dataset.folder;
                    renderFolders();
                    renderLinks();
                });
            });

            // Edit folder handler
            folderList.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    editFolder(btn.dataset.folderId);
                });
            });

            // Delete folder handler
            folderList.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteFolder(btn.dataset.folderId);
                });
            });
        }

        async function deleteFolder(folderId) {
            const folder = folders.find(f => f.id === folderId);
            if (!folder) return;

            const linkCount = links.filter(l => l.folder === folderId).length;
            
            let confirmMsg = `Bạn có chắc muốn xóa thư mục "${folder.name}"?`;
            if (linkCount > 0) {
                confirmMsg += `\n\n️ Thư mục này đang chứa ${linkCount} link(s). Các link này sẽ bị mất!`;
            }
            confirmMsg += '\n\nHành động này không thể hoàn tác!';

            if (!confirm(confirmMsg)) return;

            try {
                if (linkCount > 0) {
                    const linksToDelete = links.filter(l => l.folder === folderId);
                    for (const link of linksToDelete) {
                        await deleteDoc(doc(db, 'users', currentUser.uid, 'links', link.id));
                    }
                }

                await deleteDoc(doc(db, 'users', currentUser.uid, 'folders', folderId));

                if (currentFolder === folderId) {
                    currentFolder = 'all';
                }

                await loadData();
            } catch (error) {
                alert('Lỗi xóa thư mục: ' + error.message);
            }
        }

        function editFolder(folderId) {
            const folder = folders.find(f => f.id === folderId);
            if (!folder) return;

            folderModalTitle.textContent = 'Sửa tên thư mục';
            folderSubmitBtn.textContent = 'Cập nhật';
            document.getElementById('folderId').value = folder.id;
            document.getElementById('folderName').value = folder.name;
            folderModal.classList.add('active');
        }

        function renderLinks() {
            const searchTerm = searchInput.value.toLowerCase();
            let filteredLinks = links;

            if (currentFolder !== 'all') {
                filteredLinks = filteredLinks.filter(l => l.folder === currentFolder);
            }

            if (searchTerm) {
                filteredLinks = filteredLinks.filter(l => 
                    l.name.toLowerCase().includes(searchTerm) ||
                    l.url.toLowerCase().includes(searchTerm) ||
                    (l.tags && l.tags.some(t => t.toLowerCase().includes(searchTerm)))
                );
            }

            if (filteredLinks.length === 0) {
                linksContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>Không có link nào</h3>
                        <p>Thêm link âm thanh đầu tiên của bạn!</p>
                    </div>
                `;
                return;
            }

            linksContainer.innerHTML = filteredLinks.map(link => {
                const folder = folders.find(f => f.id === link.folder);
                const date = new Date(link.createdAt).toLocaleDateString('vi-VN');
                const tags = link.tags ? link.tags.map(t => `<span class="tag">${t}</span>`).join('') : '';

                return `
                    <div class="link-card" data-id="${link.id}">
                        <div class="link-header">
                            <div>
                                <div class="link-title">${link.name}</div>
                                <span class="link-folder">${folder ? folder.name : 'Unknown'}</span>
                            </div>
                            <div class="link-actions">
                                <button class="icon-btn edit" data-action="edit" data-id="${link.id}" title="Sửa">✏️</button>
                                <button class="icon-btn delete" data-action="delete" data-id="${link.id}" title="Xóa">🗑️</button>
                            </div>
                        </div>
                        <div class="link-url">${link.url}</div>
                        <div class="link-tags">${tags}</div>
                        <div class="link-date">📅 ${date}</div>
                    </div>
                `;
            }).join('');

            linksContainer.querySelectorAll('[data-action="edit"]').forEach(btn => {
                btn.addEventListener('click', () => editLink(btn.dataset.id));
            });
            linksContainer.querySelectorAll('[data-action="delete"]').forEach(btn => {
                btn.addEventListener('click', () => deleteLink(btn.dataset.id));
            });
        }

        function updateStats() {
            document.getElementById('totalLinks').textContent = links.length;
            document.getElementById('totalFolders').textContent = folders.length;
            const allTags = new Set();
            links.forEach(l => { if (l.tags) l.tags.forEach(t => allTags.add(t)); });
            document.getElementById('totalTags').textContent = allTags.size;
        }

        // Link Modal
        addLinkBtn.addEventListener('click', () => {
            document.getElementById('linkModalTitle').textContent = 'Thêm link mới';
            linkForm.reset();
            document.getElementById('linkId').value = '';
            linkModal.classList.add('active');
        });

        document.getElementById('closeLinkModal').addEventListener('click', () => {
            linkModal.classList.remove('active');
        });

        document.getElementById('cancelLinkBtn').addEventListener('click', () => {
            linkModal.classList.remove('active');
        });

        function editLink(id) {
            const link = links.find(l => l.id === id);
            if (!link) return;

            document.getElementById('linkModalTitle').textContent = 'Chỉnh sửa link';
            document.getElementById('linkId').value = link.id;
            document.getElementById('linkName').value = link.name;
            document.getElementById('linkUrl').value = link.url;
            document.getElementById('linkFolder').value = link.folder;
            document.getElementById('linkTags').value = link.tags ? link.tags.join(', ') : '';
            linkModal.classList.add('active');
        }

        async function deleteLink(id) {
            if (!confirm('Bạn có chắc muốn xóa link này?')) return;
            try {
                await deleteDoc(doc(db, 'users', currentUser.uid, 'links', id));
                await loadData();
            } catch (error) {
                alert('Lỗi xóa: ' + error.message);
            }
        }

        linkForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('linkId').value;
            const linkData = {
                name: document.getElementById('linkName').value.trim(),
                url: document.getElementById('linkUrl').value.trim(),
                folder: document.getElementById('linkFolder').value,
                tags: document.getElementById('linkTags').value.split(',').map(t => t.trim()).filter(t => t),
                updatedAt: new Date().toISOString()
            };

            try {
                if (id) {
                    const existingLink = links.find(l => l.id === id);
                    await setDoc(doc(db, 'users', currentUser.uid, 'links', id), {
                        ...linkData,
                        createdAt: existingLink.createdAt
                    });
                } else {
                    linkData.createdAt = new Date().toISOString();
                    const newId = Date.now().toString();
                    await setDoc(doc(db, 'users', currentUser.uid, 'links', newId), linkData);
                }
                linkModal.classList.remove('active');
                await loadData();
            } catch (error) {
                alert('Lỗi lưu link: ' + error.message);
            }
        });

        // Folder Modal
        addFolderBtn.addEventListener('click', () => {
            folderModalTitle.textContent = 'Thêm thư mục mới';
            folderSubmitBtn.textContent = 'Tạo';
            folderForm.reset();
            document.getElementById('folderId').value = '';
            folderModal.classList.add('active');
        });

        document.getElementById('closeFolderModal').addEventListener('click', () => {
            folderModal.classList.remove('active');
        });

        document.getElementById('cancelFolderBtn').addEventListener('click', () => {
            folderModal.classList.remove('active');
        });

        folderForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const folderId = document.getElementById('folderId').value;
            const name = document.getElementById('folderName').value.trim();

            try {
                if (folderId) {
                    // Update existing folder
                    await setDoc(doc(db, 'users', currentUser.uid, 'folders', folderId), {
                        name,
                        updatedAt: new Date().toISOString()
                    }, { merge: true });
                } else {
                    // Create new folder
                    await setDoc(doc(db, 'users', currentUser.uid, 'folders', Date.now().toString()), {
                        name,
                        createdAt: new Date().toISOString()
                    });
                }
                folderModal.classList.remove('active');
                folderForm.reset();
                await loadData();
            } catch (error) {
                alert('Lỗi lưu thư mục: ' + error.message);
            }
        });

        // Search
        searchInput.addEventListener('input', renderLinks);

        // Export
        exportBtn.addEventListener('click', () => {
            const data = {
                version: '1.0',
                exportedAt: new Date().toISOString(),
                folders,
                links
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `voicelinks-backup-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });

        // Import
        importBtn.addEventListener('click', () => importFile.click());

        importFile.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            try {
                const text = await file.text();
                const data = JSON.parse(text);

                if (!data.version || !data.folders || !data.links) {
                    throw new Error('File không hợp lệ');
                }

                for (const folder of data.folders) {
                    await setDoc(doc(db, 'users', currentUser.uid, 'folders', folder.id || Date.now().toString()), {
                        name: folder.name,
                        createdAt: folder.createdAt || new Date().toISOString()
                    });
                }

                for (const link of data.links) {
                    await setDoc(doc(db, 'users', currentUser.uid, 'links', link.id || Date.now().toString()), {
                        name: link.name,
                        url: link.url,
                        folder: link.folder,
                        tags: link.tags || [],
                        createdAt: link.createdAt || new Date().toISOString(),
                        updatedAt: link.updatedAt || new Date().toISOString()
                    });
                }

                alert('Nhập dữ liệu thành công!');
                await loadData();
            } catch (error) {
                alert('Lỗi nhập file: ' + error.message);
            }

            importFile.value = '';
        });

        // Close modals on outside click
        window.addEventListener('click', (e) => {
            if (e.target.classList.contains('modal')) {
                e.target.classList.remove('active');
            }
        });
    </script>
</body>
</html>
